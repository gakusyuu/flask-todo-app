<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link rel="stylesheet" href="" {{ url_for('static', filename='style.css' ) }}>
</head>

<body>
    <h1>ログイン</h1>
    {% with messages = get_flashed_messages() %}
    {% if messages %}<p style="color:red;">{{ messages[0] }}</p>{% endif %}
    {% endwith %}

    <form action="/login" method="POST">
        <p><input type="text" name="username" placeholder="ユーザー名" requires></p>
        <p><input type="password" name="password" placeholder="パスワード" requires></p>
        <button type="submit">ログイン</button>
    </form>
    <p><a href="/register">新規登録はこちら</a></p>
</body>

</html>
