<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>新規ユーザー登録</title>
    <link rel="stylesheet" href=" {{ url_for('static', filename='style.css' ) }}">
</head>

<body>
    <h1>新規ユーザー登録</h1>
    {% with messages = get_flashed_messages() %}
    {% if messages %}<p style="color:red;">{{ messages[0] }}</p>{% endif %}
    {% endwith %}

    <form action="/register" method="POST">
        <p><input type="text" name="username" placeholder="ユーザー名" requires></p>
        <p><input type="password" name="password" placeholder="パスワード" requires></p>
        <button type="submit">登録する</button>
    </form>
    <p><a href="/login">すでにアカウントをお持ちの方（ログイン）</a></p>
</body>

</html>
