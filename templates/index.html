<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="" UTF=8>
    <title>Python ToDoアプリ</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ccc;
        }

        a {
            color: red;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h2>Python Todoリスト</h2>
    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="新しいタスクを入力" required>
        <button type="submit">追加</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li>
            <span>{{ task[1] }}</span>
            <a href=" /delete/{{ task[0] }}">削除</a>
        </li>
        {% endfor %}
    </ul>
</body>

</html>
